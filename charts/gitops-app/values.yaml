goSimpleApp:
  goSimpleApp:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    env:
      port: "8080"
    image:
      repository: 058264397013.dkr.ecr.us-east-1.amazonaws.com/gitops-app
      digest: "sha256:a779fc0596a2fb7611550db05a53f32e89aae50028a960dda5ed3e5f97e51f1c"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  minAvailable: 1
  nodeSelector: {}
  podSecurityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  tolerations: []
  # labelSelector is injected by the deployment template using selectorLabels helper.
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  type: ClusterIP
kubernetesClusterDomain: cluster.local
serviceAccount:
  # For EKS IRSA, add: eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
  # For EKS Pod Identity, leave empty and configure the association via EKS console/CLI.
  annotations: {}
  # automount is false: the pod spec already sets automountServiceAccountToken: false.
  automount: false
  create: true
  name: ""
