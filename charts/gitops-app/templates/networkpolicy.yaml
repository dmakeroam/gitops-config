apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gitops-app.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "gitops-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gitops-app.fullname" . }}-default-deny-egress
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "gitops-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gitops-app.fullname" . }}-allow
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "gitops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gitops-app.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 8080
      protocol: TCP
  egress:
  # DNS to kube-system (CoreDNS) — required for all name resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
